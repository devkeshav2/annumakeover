<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – AnnuMakeover</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px">
      <div class="brand-logo-mark" style="width:44px;height:44px;border-radius:12px;font-size:17px">AM</div>
      <div class="login-logo" style="margin:0">AnnuMakeover</div>
    </div>
    <div class="login-subtitle">Admin Panel · Secure Access</div>

    <div id="loginError" class="error-msg"></div>

    <form id="loginForm" class="login-form">
      <div class="form-group" style="margin-bottom:20px">
        <label class="form-label" for="adminPin">Admin PIN</label>
        <div class="input-icon-wrap">
          <span class="input-icon">🔐</span>
          <input class="form-control" id="adminPin" type="password" placeholder="Enter your PIN" autocomplete="current-password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:16px">
        Unlock Admin Panel →
      </button>
    </form>

    <div style="text-align:center;margin-top:16px">
      <a href="index.html" style="font-size:0.82rem;color:var(--text-light);text-decoration:none">← Back to Website</a>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', initAdminLogin);
</script>
</body>
</html>
