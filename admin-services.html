<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Services | AnnuMakeover</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
</head>
<body>

<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:3px">
        <div class="brand-logo-mark" style="width:30px;height:30px;border-radius:8px;font-size:11px;flex-shrink:0;box-shadow:none">AM</div>
        <div class="admin-sidebar-logo">AnnuMakeover</div>
      </div>
      <div class="admin-sidebar-sub">Admin Panel</div>
    </div>
    <nav class="admin-nav">
      <div class="admin-nav-section">Dashboard</div>
      <a href="admin-services.html" class="admin-nav-item active">
        <span class="admin-nav-icon">✨</span> Services
      </a>
      <a href="admin-feedback.html" class="admin-nav-item">
        <span class="admin-nav-icon">💬</span> Feedback
      </a>
      <div class="admin-nav-section">Site</div>
      <a href="customer-services.html" class="admin-nav-item" target="_blank">
        <span class="admin-nav-icon">👁</span> View Website
      </a>
    </nav>
    <div class="admin-sidebar-footer">
      <button class="btn btn-outline btn-sm" style="width:100%;justify-content:center;border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.55)" onclick="adminLogout()">
        Sign Out
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <div class="admin-topbar">
      <div class="admin-page-title">Services</div>
      <div class="admin-topbar-right">
        <div class="admin-user-badge"><div class="admin-user-dot"></div> Admin</div>
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add Service</button>
      </div>
    </div>

    <!-- Stat Cards -->
    <div class="admin-stat-cards">
      <div class="admin-stat-card">
        <div class="admin-stat-icon pink">✨</div>
        <div>
          <div class="admin-stat-num" id="statTotal">–</div>
          <div class="admin-stat-lbl">Total Services</div>
        </div>
      </div>
      <div class="admin-stat-card">
        <div class="admin-stat-icon green">✅</div>
        <div>
          <div class="admin-stat-num" id="statActive">–</div>
          <div class="admin-stat-lbl">Active Services</div>
        </div>
      </div>
      <div class="admin-stat-card">
        <div class="admin-stat-icon gold">💬</div>
        <div>
          <div class="admin-stat-num" id="statFeedback">–</div>
          <div class="admin-stat-lbl">Feedback Entries</div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="admin-card">
      <div class="admin-card-header">
        <div class="admin-card-title">All Services</div>
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add New</button>
      </div>
      <div style="overflow-x:auto">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Service Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="servicesBody">
            <tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-light)">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Add / Edit Service Modal -->
<div class="modal-overlay" id="serviceModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Add New Service</div>
      <button class="modal-close" data-dismiss>&times;</button>
    </div>
    <form id="serviceForm">
      <input type="hidden" id="svcId">
      <div class="modal-form-grid">
        <div class="form-group full">
          <label class="form-label" for="svcName">Service Name *</label>
          <input class="form-control" id="svcName" type="text" placeholder="e.g. Bridal Makeup" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="svcCat">Category *</label>
          <select class="form-control" id="svcCat" required>
            <option value="makeup">💄 Makeup</option>
            <option value="facial">✨ Facial</option>
            <option value="detan">🌸 De-Tan</option>
            <option value="body">💆 Body</option>
            <option value="hair">💇 Hair</option>
            <option value="other">💅 Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="svcPrice">Price (₹) *</label>
          <input class="form-control" id="svcPrice" type="number" min="1" placeholder="e.g. 3000" required>
        </div>
        <div class="form-group full">
          <label class="form-label" for="svcDesc">Description</label>
          <textarea class="form-control" id="svcDesc" rows="3" placeholder="Short description of this service…"></textarea>
        </div>
        <div class="form-group full" style="flex-direction:row;align-items:center;gap:12px">
          <input type="checkbox" id="svcActive" checked style="width:18px;height:18px;accent-color:var(--primary)">
          <label class="form-label" for="svcActive" style="margin:0;cursor:pointer">Active (visible to customers)</label>
        </div>
      </div>
      <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px">
        <button type="button" class="btn btn-outline btn-sm" data-dismiss>Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm">Save Service</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-container"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', initAdminServices);
</script>
</body>
</html>
